[package]
name = "trickdump"
version = "0.1.0"
edition = "2021"

[dependencies]
winapi = { version = "0.3", features = [
    "winbase",
    "minwindef",
    "winnt",
    "libloaderapi",
    "ntdef",
    "processthreadsapi",
    "basetsd",
    "handleapi",
    "minwinbase",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"